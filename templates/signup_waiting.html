<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Server | Awaiting Connection</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: #0f172a; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; }
        .card { 
            background: #1e293b; 
            padding: 40px; 
            border-radius: 24px; 
            text-align: center; 
            max-width: 400px; 
            width: 100%; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
        }
        .code-display { 
            font-size: 48px; 
            letter-spacing: 12px; 
            font-weight: 700; 
            color: #3b82f6; 
            background: #0f172a; 
            padding: 20px; 
            border-radius: 12px; 
            margin: 30px 0; 
            border: 1px solid #334155; 
        }
        .loader { 
            border: 3px solid #334155; 
            border-top: 3px solid #3b82f6; 
            border-radius: 50%; 
            width: 24px; 
            height: 24px; 
            animation: spin 1s linear infinite; 
            margin: 0 auto 15px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="loader"></div>
        <h2>Awaiting Login Server...</h2>
        <p style="color: #94a3b8; font-size: 14px;">Enter this endpoint code into your Login Server terminal to complete the key exchange. Expires in 5 minutes.</p>
        
        <div class="code-display">{{ exchange_code }}</div>
        
        <p id="status-text" style="color: #10b981; font-size: 13px; font-weight: 600;">Listening for connection...</p>
    </div>

    <script>
        const endpointCode = "{{ exchange_code }}";
        
        setInterval(() => {
            fetch(`/api/status/${endpointCode}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        document.getElementById('status-text').innerText = "Exchange Successful! Redirecting...";
                        window.location.href = "/login?success=1";
                    } else if (data.status === 'expired') {
                        document.getElementById('status-text').innerText = "Endpoint expired. Please try again.";
                        document.getElementById('status-text').style.color = "#ef4444";
                        setTimeout(() => window.location.href = "/signup", 3000);
                    }
                });
        }, 2000);
    </script>
</body>
</html>
